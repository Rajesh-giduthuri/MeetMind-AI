
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/static/meetmind-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f5ff">
    <meta name="description" content="Create your MEETMIND AI account.">
    <title>Create Account | MEETMIND AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page signup-page">

    <main class="auth-screen">

        <section class="auth-card signup-card">

            <!-- Dark / Light Mode Toggle -->
            <button
                type="button"
                id="authThemeToggle"
                class="auth-theme-toggle"
                aria-label="Switch to dark mode"
                aria-pressed="false"
                title="Toggle dark/light mode"
            >
                <span id="authThemeIcon" aria-hidden="true">☾</span>
            </button>

            <!-- Brand and Heading -->
            <header class="auth-header">
                <a href="index.html" class="auth-brand" aria-label="MEETMIND AI home">
                    <h1 class="brand-title">MEETMIND <span>AI</span></h1>
                    <p class="brand-subtitle">AI Meeting Intelligence System</p>
                </a>

                <h2>Create your account</h2>
                <p class="welcome-description">
                    Get started with your AI meeting workspace.
                </p>
            </header>

            <!-- Google Sign Up -->
            <button
                type="button"
                class="google-button"
                id="googleSignup"
            >
                <svg
                    class="google-icon"
                    viewBox="0 0 48 48"
                    aria-hidden="true"
                    focusable="false"
                >
                    <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.9 6.1-15z"/>
                    <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20.4 20.4 0 0 0 24 44z"/>
                    <path fill="#FBBC05" d="M12.6 27.6a12.3 12.3 0 0 1 0-7.2v-5.3H5.8a20.4 20.4 0 0 0 0 17.8l6.8-5.3z"/>
                    <path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6.1 29.5 4 24 4A20.4 20.4 0 0 0 5.8 15.1l6.8 5.3C14.2 15.7 18.7 12.1 24 12.1z"/>
                </svg>

                <span>Continue with Google</span>
            </button>

            <!-- OR Divider -->
            <div class="auth-divider">
                <span>OR</span>
            </div>

            <!-- Signup Form -->
            <form id="signupForm">

                <div class="form-group">
                    <label for="newUsername">Username</label>
                    <input
                        type="text"
                        id="newUsername"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        minlength="3"
                        maxlength="30"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="newPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="newPassword"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            id="toggleSignupPassword"
                            class="password-toggle"
                            aria-controls="newPassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>
                    </div>

                    <small class="field-hint">
                        Use at least 8 characters.
                    </small>
                </div>

                <p
                    id="signupMessage"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button type="submit" class="primary-button">
                    Create Account <span aria-hidden="true">→</span>
                </button>

            </form>

            <!-- Login Link -->
            <p class="signup-prompt">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <!-- Home Link -->
            <p class="auth-home-link">
                <a href="index.html">← Back to home</a>
            </p>

        </section>

        <p class="auth-footer">
            © 2026 MEETMIND AI. All rights reserved.
        </p>

    </main>

    <script src="script.js"></script>
</body>
</html>

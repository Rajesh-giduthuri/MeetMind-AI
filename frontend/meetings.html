    <link rel="icon" type="image/png" href="/static/meetmind-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f5ff">
    <title>My Meetings | MEETMIND AI</title>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="pages.css">

    <style>
        /* =====================================
           MEETINGS PAGE
        ===================================== */
        .meeting-card-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }

        .file-icon-box {
            width: 60px;
            height: 60px;
            min-width: 60px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 700;
        }

        .meeting-card-info {
            flex: 1;
            min-width: 0;
        }

        .file-icon-box.video {
            background: #eaf2ff;
            color: #2478f3;
        }
        .file-icon-box.audio {
            background: #e2fbf1;
            color: #0bb88c;
        }

        .file-icon-box.pdf,
        .file-icon-box.document {
            background: #ffeaed;
            color: #ef3f50;
        }


        .file-icon-box svg {
            width: 28px;
            height: 28px;
            display: block;
        }

        .file-icon-box.document,
        .file-icon-box.pdf {
            background: #ffe8ec !important;
            color: #ed334f !important;
        }
        
        .meetings-page {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            box-sizing: border-box;
        }

        .meetings-heading h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: var(--text, #17182b);
        }

        .meetings-heading p {
            margin: 0;
            color: var(--muted, #6e748d);
            line-height: 1.6;
        }

        .meetings-toolbar {
            display: flex;
            gap: 12px;
            margin: 25px 0;
        }

        .meetings-search {
            flex: 1;
            min-width: 0;
            padding: 13px 15px;
            border: 1px solid var(--border, #dfe3ef);
            border-radius: 10px;
            background: var(--white, #fff);
            color: var(--text, #17182b);
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .meetings-search:focus {
            border-color: #6850f5;
        }

        .new-meeting-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: 9px;
            background: #6850f5;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            white-space: nowrap;
        }

        .new-meeting-btn:hover {
            background: #5137df;
        }

        .meetings-count {
            margin-bottom: 15px;
            color: var(--muted, #6e748d);
            font-size: 14px;
        }

        .meetings-list {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(min(100%, 260px), 1fr)
            );
            gap: 18px;
        }

        .meeting-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-width: 0;
            padding: 22px;
            border: 1px solid var(--border, #dfe3ef);
            border-radius: 14px;
            background: var(--white, #fff);
            color: var(--text, #17182b);
            box-shadow: 0 8px 24px rgba(36, 32, 80, 0.04);
        }

        .meeting-card h3 {
            margin: 0 0 10px;
            color: var(--text, #17182b);
            font-size: 18px;
            overflow-wrap: anywhere;
        }

        .meeting-date {
            margin-top: 12px;
            color: var(--muted, #6e748d);
            font-size: 13px;
        }

        .meeting-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: auto;
        }

        .meeting-btn {
            padding: 10px 12px;
            border: 1px solid var(--border, #dfe3ef);
            border-radius: 8px;
            background: var(--white, #fff);
            color: var(--text, #17182b);
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }

        .meeting-btn:hover {
            border-color: #6850f5;
            color: #6850f5;
        }

        .meeting-btn.primary {
            background: #6850f5;
            color: #fff;
            border-color: #6850f5;
        }

        .meeting-btn.delete {
            background: #fff0f1;
            border: 1px solid #ffe0e3;
            color: #dc3545;
        }

        .meeting-btn.delete:hover {
            background: #ffe0e3;
            border-color: #dc3545;
            color: #c82333;
        }

        .meetings-empty {
            grid-column: 1 / -1;
            padding: 55px 20px;
            text-align: center;
            border: 1px dashed var(--border, #dfe3ef);
            border-radius: 14px;
            color: var(--muted, #6e748d);
        }

        .meetings-empty h3 {
            color: var(--text, #17182b);
        }

        .meetings-empty a {
            display: inline-block;
            margin-top: 12px;
            color: #6850f5;
            text-decoration: none;
        }

        /* =====================================
           STABLE TOP BAR
        ===================================== */

        .app-layout > .main-area > .topbar {
            box-sizing: border-box;
            width: 100%;
            height: 78px;
            min-height: 78px;
            padding: 0 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 900;
            background: var(--white, #fff);
            border-bottom: 1px solid var(--border, #dfe3ef);
        }

        .meetings-topbar-title {
            flex: 1 1 auto;
            min-width: 0;
        }

        .meetings-topbar-title h3 {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }

        .app-layout > .main-area > .topbar .topbar-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            flex: 0 0 auto;
            min-width: max-content;
            height: 100%;
        }

        .app-layout > .main-area > .topbar .dashboard-theme-toggle,
        .app-layout > .main-area > .topbar .notification-button {
            box-sizing: border-box;
            width: 40px;
            height: 40px;
            min-width: 40px;
            flex: 0 0 40px;
            margin: 0;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transform: none;
        }

        .dashboard-theme-toggle {
            border: 1px solid #dfe3ef;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #34354a;
            cursor: pointer;
        }

        .dashboard-theme-toggle:hover {
            border-color: #5935f5;
        }

        .dashboard-theme-toggle svg,
        .notification-button svg {
            display: block;
            width: 21px;
            height: 21px;
        }

        .notification-button {
            position: relative;
            border: 1px solid transparent;
            border-radius: 12px;
            background: transparent;
            color: var(--text, #34354a);
            cursor: pointer;
        }

        .notification-button:hover {
            background: var(--primary-light, #f0edff);
        }

        .notification-button .notification {
            position: absolute;
            top: 7px;
            right: 7px;
        }

        .app-layout > .main-area > .topbar .profile-button {
            box-sizing: border-box;
            height: 48px;
            min-height: 48px;
            padding: 4px 10px;
            margin: 0;
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            gap: 9px;
            flex: 0 0 auto;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--text, #17182b);
            font: inherit;
            font-size: 13px;
            text-decoration: none;
            white-space: nowrap;
            cursor: pointer;
        }

        .profile-button:hover {
            background: var(--primary-light, #f0edff);
        }

        .app-layout > .main-area > .topbar .avatar {
            box-sizing: border-box;
            width: 40px;
            height: 40px;
            min-width: 40px;
            flex: 0 0 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #6979c4;
            color: #fff;
            font-weight: 700;
        }

        .profile-chevron {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 16px;
        }

        .profile-chevron svg {
            display: block;
            width: 16px;
            height: 16px;
        }

        /* =====================================
           DARK MODE
        ===================================== */

        body.dark-mode .topbar {
            background: #1c2032;
            border-bottom-color: #3b4258;
        }

        body.dark-mode .dashboard-theme-toggle {
            background: #24253c;
            color: #f1f1fc;
            border-color: #444661;
        }

        body.dark-mode .notification-button,
        body.dark-mode .profile-button {
            color: #f1f1fc;
        }

        body.dark-mode .meetings-heading h1,
        body.dark-mode .meeting-card h3,
        body.dark-mode .meetings-empty h3 {
            color: #f1f3ff;
        }

        body.dark-mode .meetings-heading p,
        body.dark-mode .meetings-count,
        body.dark-mode .meeting-date {
            color: #b7bfd4;
        }

        body.dark-mode .meetings-search,
        body.dark-mode .meeting-card,
        body.dark-mode .meetings-empty {
            background: #222638;
            color: #f1f3ff;
            border-color: #3b4258;
        }

        body.dark-mode .meetings-search::placeholder {
            color: #a8b0c5;
        }

        body.dark-mode .meeting-btn {
            background: #292f43;
            color: #f1f3ff;
            border-color: #454c64;
        }

        body.dark-mode .meeting-btn.primary {
            background: #6850f5;
            border-color: #6850f5;
            color: #fff;
        }

        body.dark-mode .meeting-btn.delete {
            background: #482b35;
            color: #ff8b9a;
            border-color: #65404b;
        }

        body.dark-mode .meeting-btn.delete:hover {
            background: #5a303d;
            color: #ffb0ba;
            border-color: #ff6b81;
        }

        /* =====================================
           RESPONSIVE
        ===================================== */

        @media (max-width: 650px) {
            .app-layout > .main-area > .topbar {
                padding: 0 14px;
                gap: 8px;
            }

            .app-layout > .main-area > .topbar .topbar-actions {
                gap: 5px;
            }

            .app-layout > .main-area > .topbar .profile-button {
                gap: 5px;
                padding: 4px;
            }

            .app-layout > .main-area > .topbar #headerProfileName,
            .meetings-topbar-title h3 {
                font-size: 13px;
            }

            .meetings-page {
                padding: 20px 14px;
            }

            .meetings-heading h1 {
                font-size: 25px;
            }

            .meetings-toolbar {
                flex-direction: column;
            }

            .new-meeting-btn {
                text-align: center;
            }

            .meeting-card {
                padding: 17px;
            }
        }

        .meeting-btn:focus-visible,
        .notification-button:focus-visible,
        .dashboard-theme-toggle:focus-visible {
            outline: 3px solid #bcb0ff;
            outline-offset: 3px;
        }

        .meeting-type {
            display: inline-flex;
            align-self: flex-start;
            width: fit-content;
            height: auto;
            padding: 4px 9px;
            margin-top: 6px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.4;
            background: #fff0f3;
            color: #f02d69;
        }
    </style>
</head>

<script>
document.addEventListener("DOMContentLoaded", function () {
    "use strict";

    const meetingsList = document.getElementById("meetingsList");
    const meetingsSearch = document.getElementById("meetingsSearch");
    const meetingsCount = document.getElementById("meetingsCount");
    const themeToggle = document.getElementById("themeToggle");
    const themeToggleIcon = document.getElementById("themeToggleIcon");
    const notificationButton = document.getElementById("notificationButton");
    const logoutLink = document.getElementById("logoutLink");

    const THEME_KEY = "meetmind-auth-theme";
    const LEGACY_THEME_KEY = "meetingAITheme";
    const SETTINGS_KEY = "meetmindDashboardSettings";

    /* =====================================
       PROFILE NAME
    ===================================== */

    function updateProfileName() {
        let profileName = "My Workspace";

        try {
            const settings = JSON.parse(
                localStorage.getItem(SETTINGS_KEY) || "{}"
            );

            profileName =
                settings.displayName ||
                settings.profileName ||
                settings.name ||
                profileName;
        } catch (error) {
            console.warn("Unable to read profile settings:", error);
        }

        profileName = String(profileName).trim() || "My Workspace";

        const nameElement = document.getElementById("headerProfileName");
        const avatarElement = document.getElementById("headerAvatar");
        const profileButton = document.getElementById("profileButton");

        if (nameElement) {
            nameElement.textContent = profileName;
        }

        if (avatarElement) {
            avatarElement.textContent = profileName
                .split(/\s+/)
                .map(function (word) {
                    return word.charAt(0);
                })
                .join("")
                .substring(0, 2)
                .toUpperCase();
        }

        if (profileButton) {
            profileButton.setAttribute("aria-label", profileName);
        }
    }

    updateProfileName();

    window.addEventListener("storage", function (event) {
        if (event.key === SETTINGS_KEY) {
            updateProfileName();
        }

        if (event.key === THEME_KEY || event.key === LEGACY_THEME_KEY) {
            applyTheme(readTheme() === "dark");
        }
    });

    /* =====================================
       THEME TOGGLE
    ===================================== */

    function applyTheme(isDark) {
        document.body.classList.toggle("dark-mode", isDark);
        document.documentElement.classList.toggle("dark-mode", isDark);

        themeToggleIcon.innerHTML = isDark
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/></svg>';

        const label = isDark
            ? "Switch to light mode"
            : "Switch to dark mode";

        themeToggle.setAttribute("aria-label", label);
        themeToggle.setAttribute("title", label);
        themeToggle.setAttribute("aria-pressed", String(isDark));

        try {
            localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
            localStorage.setItem(LEGACY_THEME_KEY, isDark ? "dark" : "light");
        } catch (error) {
            console.warn("Theme preference could not be saved.", error);
        }
    }

    function readTheme() {
        try {
            return localStorage.getItem(THEME_KEY) ||
                   localStorage.getItem(LEGACY_THEME_KEY) ||
                   "light";
        } catch (error) {
            return "light";
        }
    }

    applyTheme(readTheme() === "dark");

    themeToggle.addEventListener("click", function () {
        applyTheme(!document.body.classList.contains("dark-mode"));
    });

    /* =====================================
       READ AND SAVE MEETINGS
    ===================================== */

    function readMeetings() {
        try {
            if (
                window.MeetMind &&
                typeof window.MeetMind.readMeetings === "function"
            ) {
                const result = window.MeetMind.readMeetings();

                if (Array.isArray(result)) {
                    return result;
                }
            }

            const saved = localStorage.getItem("meetMindMeetings");
            const data = saved ? JSON.parse(saved) : [];

            return Array.isArray(data) ? data : [];
        } catch (error) {
            console.error("Unable to read meetings:", error);
            return [];
        }
    }

    function writeMeetings(meetings) {
        if (
            window.MeetMind &&
            typeof window.MeetMind.writeMeetings === "function"
        ) {
            window.MeetMind.writeMeetings(meetings);
            return;
        }

        localStorage.setItem("meetMindMeetings", JSON.stringify(meetings));
    }

    function getMeetingName(meeting) {
        return (
            meeting.name ||
            meeting.meetingName ||
            meeting.fileName ||
            meeting.title ||
            meeting.url ||
            "Untitled Meeting"
        );
    }

    function getMeetingType(meeting) {
        if (meeting.type) {
            return String(meeting.type).toUpperCase();
        }

        const filename = meeting.fileName || meeting.name || "";

        if (filename.includes(".")) {
            return filename.split(".").pop().toUpperCase();
        }

        return meeting.url ? "URL" : "MEETING";
    }

    function getMeetingDate(meeting) {
        const rawDate =
            meeting.date ||
            meeting.createdAt ||
            meeting.timestamp;

        if (!rawDate) {
            return "Date unavailable";
        }

        const date = new Date(rawDate);

        return Number.isNaN(date.getTime())
            ? String(rawDate)
            : date.toLocaleString();
    }

    

    function getFileIcon(meeting) {
        const filename = String(
            meeting.fileName || meeting.name || ""
        ).toLowerCase();

        const extension = filename.split(".").pop();

        const icons = {
            video: `
                <svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="13" height="14" rx="2"/>
                    <path d="m16 10 5-3v10l-5-3z"/>
                </svg>
            `,
            audio: `
                <svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v18"/>
                    <path d="M8 7v10"/>
                    <path d="M4 10v4"/>
                    <path d="M16 6v12"/>
                    <path d="M20 9v6"/>
                </svg>
            `,
            document: `
                <svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <path d="M14 2v6h6"/>
                    <path d="M8 13h8M8 17h8"/>
                </svg>
            `
        };

        if (["mp4", "webm", "mov", "avi", "mkv"].includes(extension)) {
            return { className: "video", icon: icons.video };
        }

        if (["mp3", "wav", "m4a", "ogg", "aac", "flac"].includes(extension)) {
            return { className: "audio", icon: icons.audio };
        }

        if (["pdf", "doc", "docx"].includes(extension)) {
            return { className: "document", icon: icons.document };
        }

        return { className: "document", icon: icons.document };
    }


    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (character) {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };

            return entities[character];
        });
    }

    function safeFilename(name) {
        return String(name)
            .replace(/[<>:"/\\|?*\x00-\x1F]/g, "_")
            .replace(/\s+/g, "_")
            .slice(0, 100) || "meeting";
    }

    /* =====================================
       EXPORT MEETING
    ===================================== */

    function getExportDetails(meeting) {
        return {
            name: getMeetingName(meeting),
            type: getMeetingType(meeting),
            date: getMeetingDate(meeting),
            url: meeting.url || "",
            description: meeting.description || "",
            summary: meeting.summary || "",
            transcript: meeting.transcript || ""
        };
    }

    async function downloadPDF(meeting) {
        const meetingId = meeting.id;

        try {
            const response = await fetch(
                "/api/meetings/" + encodeURIComponent(meetingId) + "/report/pdf",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(
                    errorData.detail || "Could not download the PDF."
                );
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = safeFilename(getMeetingName(meeting)) + ".pdf";

            document.body.appendChild(link);
            link.click();
            link.remove();

            URL.revokeObjectURL(url);

        } catch (error) {
            console.error("PDF download failed:", error);
            alert(error.message);
        }
    }

    async function downloadDOC(meeting) {
        const meetingId = meeting.id;

        try {
            const response = await fetch(
                "/api/meetings/" + encodeURIComponent(meetingId) + "/report/docx",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(
                    errorData.detail || "Could not download the Word document."
                );
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = safeFilename(getMeetingName(meeting)) + ".docx";

            document.body.appendChild(link);
            link.click();
            link.remove();

            URL.revokeObjectURL(url);

        } catch (error) {
            console.error("DOC download failed:", error);
            alert(error.message);
        }
    }

    /* =====================================
       RENDER MEETING CARDS
    ===================================== */

    async function renderMeetings() {
        const searchText = meetingsSearch.value.trim().toLowerCase();

        let meetings = [];

        meetingsList.innerHTML = "";
        meetingsCount.textContent = "Loading meetings...";

        try {
            const response = await fetch("/api/meetings", {
                method: "GET",
                credentials: "same-origin"
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Could not load meetings.");
            }

            meetings = (data.meetings || []).map(function (item) {
                return {
                    id: item.meeting_id,
                    name: item.filename,
                    fileName: item.filename,
                    createdAt: item.created_at,
                    type: item.filename.includes(".")
                        ? item.filename.split(".").pop().toUpperCase()
                        : "MEETING",
                    duration: item.duration,
                    status: item.status
                };
            });

        } catch (error) {
            console.error("Could not load meetings:", error);
            meetingsCount.textContent = "Unable to load meetings.";
            return;
        }

        const filtered = meetings.filter(function (meeting) {
            return (
                getMeetingName(meeting).toLowerCase().includes(searchText) ||
                getMeetingType(meeting).toLowerCase().includes(searchText)
            );
        });

        meetingsList.innerHTML = "";
        meetingsCount.textContent =
            filtered.length +
            (filtered.length === 1 ? " meeting" : " meetings");

        if (filtered.length === 0) {
            const empty = document.createElement("div");
            empty.className = "meetings-empty";

            const heading = document.createElement("h3");
            const message = document.createElement("p");
            const link = document.createElement("a");

            if (meetings.length === 0) {
                heading.textContent = "No meetings saved yet";
                message.textContent = "Analyze your first meeting to see it here.";
            } else {
                heading.textContent = "No matching meetings";
                message.textContent = "Try another meeting name or file type.";
            }

            link.href = "/";
            link.textContent = "+ Analyze a meeting";

            empty.append(heading, message, link);
            meetingsList.appendChild(empty);
            return;
        }

        filtered.forEach(function (meeting) {
            const meetingId = String(meeting.id ?? "");
            const originalIndex = meetings.indexOf(meeting);

            const card = document.createElement("article");
            card.className = "meeting-card";

            const cardHeader = document.createElement("div");
            cardHeader.className = "meeting-card-header";

            const visual = getFileIcon(meeting);

            const iconBox = document.createElement("div");
            iconBox.className = "file-icon-box " + visual.className;
            iconBox.innerHTML = visual.icon;

            const info = document.createElement("div");
            info.className = "meeting-card-info";

            const title = document.createElement("h3");
            title.textContent = getMeetingName(meeting);

            const type = document.createElement("span");
            type.className = "meeting-type";
            type.textContent = getMeetingType(meeting);

            const date = document.createElement("div");
            date.className = "meeting-date";
            date.textContent = getMeetingDate(meeting);

            info.append(title, date, type);

            const actions = document.createElement("div");
            actions.className = "meeting-actions";

            /* Open meeting */
            const openButton = document.createElement("button");
            openButton.className = "meeting-btn primary";
            openButton.type = "button";
            openButton.textContent = "Open";

            openButton.addEventListener("click", function () {
                if (!meetingId) {
                    alert("This meeting has no ID and cannot be opened.");
                    return;
                }

                window.location.href =
                    "analysis.html?id=" + encodeURIComponent(meetingId);
            });

            /* Rename meeting */
            const renameButton = document.createElement("button");
            renameButton.className = "meeting-btn";
            renameButton.type = "button";
            renameButton.textContent = "Rename";

            renameButton.addEventListener("click", async function () {
                const newName = prompt(
                    "Enter a new meeting name:",
                    getMeetingName(meeting)
                );

                if (newName === null) return;

                if (!newName.trim()) {
                    alert("Meeting name cannot be empty.");
                    return;
                }

                try {
                    const response = await fetch(
                        "/api/meetings/" + encodeURIComponent(meetingId) + "/rename",
                        {
                            method: "PATCH",
                            credentials: "same-origin",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                filename: newName.trim()
                            })
                        }
                    );

                    const data = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        throw new Error(data.detail || "Could not rename meeting.");
                    }

                    alert("Meeting renamed successfully.");
                    renderMeetings();

                } catch (error) {
                    console.error("Could not rename meeting:", error);
                    alert(error.message);
                }
            });

            /* Delete meeting */
            const deleteButton = document.createElement("button");
            deleteButton.className = "meeting-btn delete";
            deleteButton.type = "button";
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", async function () {
                const confirmed = confirm(
                    'Delete "' + getMeetingName(meeting) +
                    '" from your saved meetings?'
                );

                if (!confirmed) return;

                try {
                    const response = await fetch(
                        "/api/meetings/" + encodeURIComponent(meetingId),
                        {
                            method: "DELETE",
                            credentials: "same-origin"
                        }
                    );

                    const data = await response.json().catch(() => ({}));

                    if (!response.ok) {
                        throw new Error(data.detail || "Could not delete meeting.");
                    }

                    alert("Meeting deleted successfully.");
                    renderMeetings();

                } catch (error) {
                    console.error("Could not delete meeting:", error);
                    alert(error.message);
                }
            });

            /* Download PDF */
            const pdfButton = document.createElement("button");
            pdfButton.className = "meeting-btn";
            pdfButton.type = "button";
            pdfButton.textContent = "Download PDF";
            pdfButton.addEventListener("click", function () {
                downloadPDF(meeting);
            });

            /* Download DOC */
            const docButton = document.createElement("button");
            docButton.className = "meeting-btn";
            docButton.type = "button";
            docButton.textContent = "Download DOC";
            docButton.addEventListener("click", function () {
                downloadDOC(meeting);
            });

            actions.append(
                openButton,
                renameButton,
                deleteButton,
                pdfButton,
                docButton
            );

            cardHeader.append(iconBox, info);

            card.append(cardHeader, actions);
            meetingsList.appendChild(card);
        });
    }

    meetingsSearch.addEventListener("input", renderMeetings);
    renderMeetings();

    /* Notifications */
    notificationButton.addEventListener("click", function () {
        alert("You have no new notifications.");
    });

    /* Logout confirmation */
    logoutLink.addEventListener("click", function (event) {
        const confirmed = confirm("Are you sure you want to log out?");

        if (!confirmed) {
            event.preventDefault();
        }
    });
});
</script>
</body>
</html>

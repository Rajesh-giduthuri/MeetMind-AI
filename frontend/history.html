
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/static/meetmind-logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f5ff">
    <title>Meeting History | MEETMIND AI</title>

    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="pages.css">

    <style>
        /* History page */
        .history-page {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px;
            color: var(--text, #17182b);
        }

        .history-heading {
            margin-bottom: 25px;
        }

        .history-heading h1 {
            margin: 0 0 8px;
            font-size: 30px;
            color: var(--text, #17182b);
        }

        .history-heading p {
            margin: 0;
            color: var(--muted, #6e748d);
            line-height: 1.6;
        }

        .history-toolbar {
            display: flex;
            gap: 12px;
            margin: 25px 0;
        }

        .history-search {
            flex: 1;
            min-width: 0;
            padding: 13px 15px;
            border: 1px solid var(--border, #dfe3ef);
            border-radius: 10px;
            background: var(--white, #fff);
            color: var(--text, #17182b);
            font-size: 15px;
            outline: none;
        }

        .history-search:focus {
            border-color: #6850f5;
        }

        .history-count {
            margin-bottom: 15px;
            color: var(--muted, #6e748d);
            font-size: 14px;
        }

        .history-list {
            display: grid;
            gap: 16px;
        }

        .history-card {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            padding: 22px;
            border: 1px solid var(--border, #dfe3ef);
            border-radius: 14px;
            background: var(--white, #fff);
            color: var(--text, #17182b);
            box-shadow: 0 8px 24px rgba(36, 32, 80, 0.04);
        }

        .history-file-icon {
            width: 60px;
            height: 60px;
            min-width: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            flex-shrink: 0;
        }

        .history-file-icon.video {
            background: #eaf2ff;
            color: #2478f3;
        }

        .history-file-icon.audio {
            background: #e2fbf1;
            color: #0bb88c;
        }

        .history-file-icon.document {
            background: #ffe8ec;
            color: #ed334f;
        }

        .history-file-icon svg {
            width: 28px;
            height: 28px;
            display: block;
        }

        .history-info {
            min-width: 0;
            flex: 1;
        }

        .history-info h3 {
            margin: 0 0 9px;
            font-size: 17px;
            color: var(--text, #17182b);
            overflow-wrap: anywhere;
        }

        .history-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            color: var(--muted, #6e748d);
            font-size: 13px;
        }

        .history-actions {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            flex-shrink: 0;
            margin-left: auto;
        }

        .history-btn {
            padding: 9px 13px;
            border: 1px solid var(--border, #dfe3ef);
            border-radius: 8px;
            background: var(--white, #fff);
            color: var(--text, #17182b);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
        }

        .history-btn:hover {
            border-color: #6850f5;
            color: #6850f5;
        }

        .history-btn.primary {
            background: #6850f5;
            border-color: #6850f5;
            color: #fff;
        }

        .history-btn.primary:hover {
            background: #5740df;
            color: #fff;
        }

        .history-btn.delete {
            background: #fff0f1;
            border: 1px solid #ffe0e3;
            color: #dc3545;
        }

        .history-btn.delete:hover {
            background: #ffe0e3;
            border-color: #dc3545;
            color: #c82333;
        }

        .history-empty {
            padding: 55px 20px;
            text-align: center;
            border: 1px dashed var(--border, #dfe3ef);
            border-radius: 14px;
            background: var(--white, #fff);
            color: var(--muted, #6e748d);
        }

        .history-empty h3 {
            margin-bottom: 8px;
            color: var(--text, #17182b);
        }

        .history-empty a {
            display: inline-block;
            margin-top: 12px;
            color: #6850f5;
            text-decoration: none;
        }

        /* Dashboard-compatible top bar */
        .topbar-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            flex-shrink: 0;
        }

        .dashboard-theme-toggle {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 1px solid #dfe3ef;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            color: #34354a;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease,
                border-color 0.2s ease, transform 0.2s ease;
        }

        .dashboard-theme-toggle:hover {
            border-color: #5935f5;
            transform: translateY(-1px);
        }

        .dashboard-theme-toggle svg {
            display: block;
            width: 21px;
            height: 21px;
        }

        .notification-button {
            position: relative;
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 1px solid transparent;
            border-radius: 12px;
            background: transparent;
            color: var(--text, #34354a);
            cursor: pointer;
        }

        .notification-button:hover {
            background: var(--primary-light, #f0edff);
        }

        .notification-button svg {
            display: block;
            width: 21px;
            height: 21px;
        }

        .profile-button {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 6px 10px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: transparent;
            color: var(--text, #17182b);
            font: inherit;
            font-size: 13px;
            text-decoration: none;
            white-space: nowrap;
        }

        .profile-button:hover {
            background: var(--primary-light, #f0edff);
        }

        .profile-chevron svg {
            display: block;
            width: 16px;
            height: 16px;
        }

        /* Dark mode */
        body.dark-mode .dashboard-theme-toggle {
            background: #24253c;
            color: #f1f1fc;
            border-color: #444661;
        }

        body.dark-mode .notification-button,
        body.dark-mode .profile-button {
            color: #f1f1fc;
        }

        body.dark-mode .history-heading h1,
        body.dark-mode .history-info h3,
        body.dark-mode .history-empty h3 {
            color: #f1f3ff;
        }

        body.dark-mode .history-heading p,
        body.dark-mode .history-meta,
        body.dark-mode .history-count,
        body.dark-mode .history-empty p {
            color: #b7bfd4;
        }

        body.dark-mode .history-search,
        body.dark-mode .history-card,
        body.dark-mode .history-empty {
            background: #222638;
            color: #f1f3ff;
            border-color: #3b4258;
        }

        body.dark-mode .history-search::placeholder {
            color: #a8b0c5;
        }

        body.dark-mode .history-btn {
            background: #292f43;
            color: #f1f3ff;
            border-color: #454c64;
        }

        body.dark-mode .history-btn:hover {
            border-color: #8b7aff;
            color: #c5bcff;
        }

        body.dark-mode .history-btn.primary,
        body.dark-mode .history-btn.primary:hover {
            background: #6850f5;
            color: #fff;
            border-color: #6850f5;
        }

        body.dark-mode .history-btn.delete {
            background: #482b35;
            color: #ff8b9a;
            border-color: #65404b;
        }

        body.dark-mode .history-btn.delete:hover {
            background: #5a303d;
            color: #ffb0ba;
            border-color: #ff6b81;
        }

        .dashboard-theme-toggle:focus-visible,
        .notification-button:focus-visible,
        .history-btn:focus-visible {
            outline: 3px solid #bcb0ff;
            outline-offset: 3px;
        }

        @media (max-width: 900px) {
            .history-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .history-actions {
                width: 100%;
            }
        }

        @media (max-width: 700px) {
            .history-page {
                padding: 20px 14px;
            }

            .history-heading h1 {
                font-size: 25px;
            }

            .history-toolbar {
                flex-direction: column;
            }

            .history-card {
                padding: 17px;
            }

            .history-actions {
                gap: 7px;
            }

            .history-btn {
                flex: 1;
            }

            .topbar-actions {
                gap: 6px;
            }

            .profile-button > span:not(.avatar):not(.profile-chevron) {
                display: none;
            }
        }
        .history-filter {
            min-width: 130px;
            padding: 12px 14px;
            border: 1px solid var(--border, #dfe3ef);
            border-radius: 10px;
            background: var(--white, #fff);
            color: var(--text, #17182b);
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        .history-filter:focus {
            border-color: #6850f5;
        }

        body.dark-mode .history-filter {
            background: #222638;
            color: #f1f3ff;
            border-color: #3b4258;
        }
    </style>
</head>

<script>
document.addEventListener("DOMContentLoaded", function () {
    "use strict";

    const historyList = document.getElementById("historyList");
    const historySearch = document.getElementById("historySearch");
    const historyTypeFilter = document.getElementById("historyTypeFilter");
    const historySortOrder = document.getElementById("historySortOrder");
    const historyCount = document.getElementById("historyCount");
    const historyEmpty = document.getElementById("historyEmpty");
    const emptyTitle = document.getElementById("emptyTitle");
    const emptyMessage = document.getElementById("emptyMessage");
    const themeToggle = document.getElementById("themeToggle");
    const themeToggleIcon = document.getElementById("themeToggleIcon");
    const notificationButton = document.getElementById("notificationButton");
    const logoutLink = document.getElementById("logoutLink");

    const THEME_KEY = "meetmind-auth-theme";
    const LEGACY_THEME_KEY = "meetingAITheme";

    /* Theme shared with the dashboard */
    function readTheme() {
        try {
            return localStorage.getItem(THEME_KEY) ||
                localStorage.getItem(LEGACY_THEME_KEY) ||
                "light";
        } catch (error) {
            return "light";
        }
    }

    function applyTheme(isDark) {
        document.body.classList.toggle("dark-mode", isDark);
        document.documentElement.classList.toggle("dark-mode", isDark);

        themeToggleIcon.innerHTML = isDark
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2z"/></svg>';

        const label = isDark ? "Switch to light mode" : "Switch to dark mode";

        themeToggle.setAttribute("aria-label", label);
        themeToggle.setAttribute("title", label);
        themeToggle.setAttribute("aria-pressed", String(isDark));

        try {
            localStorage.setItem(THEME_KEY, isDark ? "dark" : "light");
            localStorage.setItem(LEGACY_THEME_KEY, isDark ? "dark" : "light");
        } catch (error) {
            console.warn("Could not save the theme preference.", error);
        }
    }

    applyTheme(readTheme() === "dark");

    themeToggle.addEventListener("click", function () {
        applyTheme(!document.body.classList.contains("dark-mode"));
    });

    /* Read meetings using the existing storage system */
    function readMeetings() {
        try {
            if (
                window.MeetMind &&
                typeof window.MeetMind.readMeetings === "function"
            ) {
                const result = window.MeetMind.readMeetings();

                if (Array.isArray(result)) {
                    return result;
                }
            }

            const saved = localStorage.getItem("meetMindMeetings");
            const meetings = saved ? JSON.parse(saved) : [];

            return Array.isArray(meetings) ? meetings : [];
        } catch (error) {
            console.error("Could not read meetings:", error);
            return [];
        }
    }

    function writeMeetings(meetings) {
        if (
            window.MeetMind &&
            typeof window.MeetMind.writeMeetings === "function"
        ) {
            window.MeetMind.writeMeetings(meetings);
            return;
        }

        localStorage.setItem("meetMindMeetings", JSON.stringify(meetings));
    }

    function getMeetingName(meeting) {
        return (
            meeting.name ||
            meeting.meetingName ||
            meeting.fileName ||
            meeting.title ||
            meeting.url ||
            "Untitled Meeting"
        );
    }

    function getMeetingDate(meeting) {
        const rawDate =
            meeting.date ||
            meeting.createdAt ||
            meeting.timestamp;

        if (!rawDate) {
            return "Date unavailable";
        }

        const date = new Date(rawDate);

        return Number.isNaN(date.getTime())
            ? String(rawDate)
            : date.toLocaleString();
    }

    function getMeetingType(meeting) {
        if (meeting.type) {
            return String(meeting.type).toUpperCase();
        }

        const source = meeting.fileName || meeting.name || "";
        const extension = source.includes(".")
            ? source.split(".").pop().toUpperCase()
            : "";

        return extension || (meeting.url ? "URL" : "MEETING");
    }
    function getMeetingCategory(meeting) {
        const type = getMeetingType(meeting).toLowerCase();

        if (["video", "mp4", "mov", "avi", "mkv", "webm", "mpeg"].includes(type)) {
            return "video";
        }

        if (["audio", "mp3", "wav", "m4a", "aac", "ogg", "flac"].includes(type)) {
            return "audio";
        }

        if (["document", "pdf", "doc", "docx", "txt", "ppt", "pptx", "xls", "xlsx"].includes(type)) {
            return "document";
        }

        const name = getMeetingName(meeting).toLowerCase();

        if (/\.(mp4|mov|avi|mkv|webm|mpeg)$/i.test(name)) {
            return "video";
        }

        if (/\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(name)) {
            return "audio";
        }

        if (/\.(pdf|doc|docx|txt|ppt|pptx|xls|xlsx)$/i.test(name)) {
            return "document";
        }

        return "other";
    }

    


    function getHistoryFileIcon(meeting) {
        const category = getMeetingCategory(meeting);

        const icons = {
            video: `
                <svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="5" width="13" height="14" rx="2"/>
                    <path d="m16 10 5-3v10l-5-3z"/>
                </svg>
            `,
            audio: `
                <svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v18"/>
                    <path d="M8 7v10"/>
                    <path d="M4 10v4"/>
                    <path d="M16 6v12"/>
                    <path d="M20 9v6"/>
                </svg>
            `,
            document: `
                <svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <path d="M14 2v6h6"/>
                    <path d="M8 13h8M8 17h8"/>
                </svg>
            `
        };

        return {
            category,
            icon: icons[category] || icons.document
        };
    }

    /* Export helpers */
    function safeFilename(name) {
        return name
            .replace(/[<>:"/\\|?*\x00-\x1F]/g, "_")
            .replace(/\s+/g, "_")
            .slice(0, 100) || "meeting";
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (character) {
            const entities = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };

            return entities[character];
        });
    }

    async function downloadPDF(meeting) {
        const meetingId = meeting.id;

        try {
            const response = await fetch(
                "/api/meetings/" + encodeURIComponent(meetingId) + "/report/pdf",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));

                throw new Error(
                    errorData.detail || "Could not download the PDF."
                );
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = safeFilename(getMeetingName(meeting)) + ".pdf";

            document.body.appendChild(link);
            link.click();
            link.remove();

            URL.revokeObjectURL(url);

        } catch (error) {
            console.error("PDF download failed:", error);
            alert(error.message);
        }
    }

    async function downloadDOC(meeting) {
        const meetingId = meeting.id;

        try {
            const response = await fetch(
                "/api/meetings/" + encodeURIComponent(meetingId) + "/report/docx",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));

                throw new Error(
                    errorData.detail || "Could not download the Word document."
                );
            }

            const blob = await response.blob();
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");
            link.href = url;
            link.download = safeFilename(getMeetingName(meeting)) + ".docx";

            document.body.appendChild(link);
            link.click();
            link.remove();

            URL.revokeObjectURL(url);

        } catch (error) {
            console.error("DOC download failed:", error);
            alert(error.message);
        }
    }

    /* Render history */
    async function renderHistory() {
        const searchText = historySearch.value.trim().toLowerCase();

        historyList.innerHTML = "";
        historyCount.textContent = "Loading meetings...";
        historyEmpty.style.display = "none";

        try {
            const response = await fetch("/api/meetings", {
                method: "GET",
                credentials: "same-origin"
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(
                    data.detail || "Could not load meeting history."
                );
            }

            const meetings = (data.meetings || []).map(item => ({
                id: item.meeting_id,
                name: item.filename,
                fileName: item.filename,
                createdAt: item.created_at,
                type: item.filename.split(".").pop().toUpperCase(),
                duration: item.duration,
                status: item.status
            }));

            const selectedType = historyTypeFilter.value;
            const sortOrder = historySortOrder.value;

            const filteredMeetings = meetings.filter(function (meeting) {
                const matchesSearch =
                    getMeetingName(meeting).toLowerCase().includes(searchText) ||
                    getMeetingType(meeting).toLowerCase().includes(searchText);

                const matchesType =
                    selectedType === "all" ||
                    getMeetingCategory(meeting) === selectedType;

                return matchesSearch && matchesType;
            });

            filteredMeetings.sort(function (a, b) {
                const dateA = new Date(
                    a.date || a.createdAt || a.timestamp || 0
                ).getTime();

                const dateB = new Date(
                    b.date || b.createdAt || b.timestamp || 0
                ).getTime();

                const validA = Number.isNaN(dateA) ? 0 : dateA;
                const validB = Number.isNaN(dateB) ? 0 : dateB;

                return sortOrder === "oldest"
                    ? validA - validB
                    : validB - validA;
            });

            historyCount.textContent =
                filteredMeetings.length +
                (filteredMeetings.length === 1
                    ? " meeting found"
                    : " meetings found");

            if (filteredMeetings.length === 0) {
                historyEmpty.style.display = "block";

                emptyTitle.textContent = meetings.length === 0
                    ? "No meeting history yet"
                    : "No matching meetings";

                emptyMessage.textContent = meetings.length === 0
                    ? "Analyze a meeting from your dashboard to see it here."
                    : "Try a different search term.";

                return;
            }

            historyEmpty.style.display = "none";

            // Keep the existing meeting-card rendering code here.
            // We will update its actions in the next steps.

            filteredMeetings.forEach(function (meeting) {
                const meetingId = String(meeting.id || "");

                // Create meeting card
                const card = document.createElement("article");
                card.className = "history-card";



                // File type icon
                const visual = getHistoryFileIcon(meeting);

                const iconBox = document.createElement("div");
                iconBox.className = "history-file-icon " + visual.category;
                iconBox.innerHTML = visual.icon;

                // Meeting information
                const info = document.createElement("div");
                info.className = "history-info";

                const title = document.createElement("h3");
                title.textContent = getMeetingName(meeting);

                const meta = document.createElement("div");
                meta.className = "history-meta";

                const type = document.createElement("span");
                type.textContent = "Type: " + getMeetingType(meeting);

                const date = document.createElement("span");
                date.textContent = getMeetingDate(meeting);

                meta.append(type, date);
                info.append(title, meta);

                // Meeting actions
                const actions = document.createElement("div");
                actions.className = "history-actions";

                // Open button
                const openButton = document.createElement("button");
                openButton.className = "history-btn primary";
                openButton.textContent = "Open";
                openButton.type = "button";

                openButton.addEventListener("click", function () {
                    if (!meetingId) {
                        alert("This meeting has no ID.");
                        return;
                    } 

                    window.location.href =
                        "analysis.html?id=" + encodeURIComponent(meetingId);
                });

                // Rename button
                const renameButton = document.createElement("button");
                renameButton.className = "history-btn";
                renameButton.textContent = "Rename";
                renameButton.type = "button";

                renameButton.addEventListener("click", async function () {
                    const newName = prompt(
                        "Enter a new meeting name:",
                        getMeetingName(meeting)
                    );

                    if (newName === null) return;

                    if (!newName.trim()) {
                        alert("Meeting name cannot be empty.");
                        return;
                    }

                    try {
                        const response = await fetch(
                            "/api/meetings/" + encodeURIComponent(meetingId) + "/rename",
                            {
                                method: "PATCH",
                                credentials: "same-origin",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    filename: newName.trim()
                                })
                            }
                        );

                        const data = await response.json().catch(() => ({}));

                        if (!response.ok) {
                            throw new Error(data.detail || "Could not rename meeting.");
                        }

                        alert("Meeting renamed successfully.");
                        renderHistory();

                    } catch (error) {
                        alert(error.message);
                    }
                });

                // Delete button
                const deleteButton = document.createElement("button");
                deleteButton.className = "history-btn delete";
                deleteButton.textContent = "Delete";
                deleteButton.type = "button";

                deleteButton.addEventListener("click", async function () {
                    const confirmed = confirm(
                        'Delete "' + getMeetingName(meeting) + '" from your saved meetings?'
                    );

                    if (!confirmed) return;

                    try {
                        const response = await fetch(
                            "/api/meetings/" + encodeURIComponent(meetingId),
                            {
                                method: "DELETE",
                                credentials: "same-origin"
                            }
                        );

                        const data = await response.json().catch(() => ({}));

                        if (!response.ok) {
                            throw new Error(data.detail || "Could not delete meeting.");
                        }

                        alert("Meeting deleted successfully.");
                        renderHistory();

                    } catch (error) {
                        alert(error.message);
                    }
                });

                // Download PDF button
                const pdfButton = document.createElement("button");
                pdfButton.className = "history-btn";
                pdfButton.textContent = "Download PDF";
                pdfButton.type = "button";
                pdfButton.addEventListener("click", function () {
                    downloadPDF(meeting);
                });

                // Download DOC button
                const docButton = document.createElement("button");
                docButton.className = "history-btn";
                docButton.textContent = "Download DOC";
                docButton.type = "button";
                docButton.addEventListener("click", function () {
                    downloadDOC(meeting);
                });

                // Add all buttons
                actions.append(
                    openButton,
                    renameButton,
                    deleteButton,
                    pdfButton,
                    docButton
                );
                card.append(iconBox, info, actions);
                historyList.appendChild(card);
            });

        } catch (error) {
            console.error("Could not load meeting history:", error);

            historyCount.textContent = "Unable to load meetings.";

            historyEmpty.style.display = "block";
            emptyTitle.textContent = "Could not load meeting history";
            emptyMessage.textContent = error.message;
        }
    }

    historySearch.addEventListener("input", renderHistory);
    historyTypeFilter.addEventListener("change", renderHistory);
    historySortOrder.addEventListener("change", renderHistory);

    notificationButton.addEventListener("click", function () {
        alert("You have no new notifications.");
    });

    logoutLink.addEventListener("click", function (event) {
        const confirmed = confirm("Are you sure you want to log out?");

        if (!confirmed) {
            event.preventDefault();
        }
    });

    renderHistory();
});
</script>
